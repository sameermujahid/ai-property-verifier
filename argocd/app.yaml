apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-property-verifier
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sameermujahid/ai-property-verifier.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true 